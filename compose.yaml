services:
  db:
    image: mongo:7
    container_name: aguiabranca-db
    # Replica set de um no so: nao e por disponibilidade, e porque transacao no Mongo exige
    # replica set. Sem isto o PATCH /projects/{id}/metrics falha ao abrir a transacao.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # O proprio healthcheck inicia o replica set na primeira subida e vira ping depois.
      # Um container de init separado so para rodar rs.initiate seria mais uma peca para
      # esquecer de subir.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aguiabranca-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATA_MONGODB_URI: mongodb://db:27017/${MONGO_DB:-aguiabranca}?directConnection=true
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-segredo-de-dev-com-mais-de-32-bytes-para-hs256-autenticacao}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
