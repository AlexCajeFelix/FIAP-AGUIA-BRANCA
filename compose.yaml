services:
  db:
    image: mongo:7
    container_name: aguiabranca-db
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-aguiabranca}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aguiabranca-app
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      MONGODB_URI: mongodb://db:27017/${MONGO_DB:-aguiabranca}
      JWT_SECRET: ${JWT_SECRET:-segredo-de-dev-com-mais-de-32-bytes-para-hs256-autenticacao}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
