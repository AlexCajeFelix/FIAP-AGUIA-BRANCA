services:
  db:
    ports: !reset []

  app:
    build: !reset null
    image: ${APP_IMAGE:?defina APP_IMAGE com a imagem publicada no registry}
    ports: !override
      - "${APP_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: staging
      APP_ENVIRONMENT: staging
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (secret do environment staging no GitHub)}
    deploy:
      resources:
        limits:
          memory: 768M

networks:
  backend:
    internal: true
