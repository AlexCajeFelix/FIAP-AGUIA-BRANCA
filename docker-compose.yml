name: aguiabranca

services:
  db:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend
    healthcheck:
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) {
        rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-local}
    image: ${APP_IMAGE:-aguiabranca-api:local}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATA_MONGODB_URI: mongodb://db:27017/${MONGO_DB:-aguiabranca}?directConnection=true
      SERVER_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-segredo-de-dev-com-mais-de-32-bytes-para-hs256-autenticacao}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      APP_VERSION: ${APP_VERSION:-local}
      LOGGING_FILE_NAME: /app/logs/aguiabranca.log
    volumes:
      - app_logs:/app/logs
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  mongo_data:
  app_logs:
