spring:
  application:
    name: fiap-aguia-branca

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguiabranca}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  jwt:
    secret: ${JWT_SECRET:}
    expiration: PT30M
    refresh-expiration: P7D

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    ip:
      capacity: ${RATE_LIMIT_IP_CAPACITY:10}
      duration-minutes: ${RATE_LIMIT_IP_DURATION_MINUTES:1}
    email:
      capacity: ${RATE_LIMIT_EMAIL_CAPACITY:5}
      duration-minutes: ${RATE_LIMIT_EMAIL_DURATION_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  pattern:
    level: "%5p [%X{requestId:-sem-request-id}]"
  level:
    org.springframework.data.mongodb.core.index: INFO
