# Profile de producao. Sem seed (o DevSeedRunner so existe em dev e staging) e sem default para
# JWT_SECRET: a aplicacao nao sobe se o segredo nao vier do ambiente.
server:
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  environment: ${APP_ENVIRONMENT:production}

logging:
  level:
    root: INFO
    org.mongodb.driver: WARN
